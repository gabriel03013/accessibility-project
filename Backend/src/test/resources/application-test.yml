spring:
  datasource:
    url: jdbc:h2:mem:partiu;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        default_schema: public
  flyway:
    enabled: false

app:
  jwt:
    issuer: https://auth.partiuquadra.test
    secret: 1234567890123456789012345678901234567890123456789012345678901234
    access-ttl: PT15M
    refresh-ttl: P30D
