spring:
  application:
    name: partiu-quadra-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/partiu_quadra}
    username: ${SPRING_DATASOURCE_USERNAME:partiu_app}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: 5000
      validation-timeout: 2000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: app
        jdbc:
          time_zone: UTC
          batch_size: 25
        order_inserts: true
        order_updates: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    default-schema: app
    schemas: app
    create-schemas: true
  mvc:
    problemdetails:
      enabled: true
  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 8MB

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework
  shutdown: graceful
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
  compression:
    enabled: true

management:
  server:
    port: ${MANAGEMENT_SERVER_PORT:${SERVER_PORT:8080}}
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

app:
  jwt:
    issuer: ${APP_JWT_ISSUER:https://auth.partiuquadra.local}
    secret: ${APP_JWT_SECRET:}
    access-ttl: ${APP_JWT_ACCESS_TTL:PT15M}
    refresh-ttl: ${APP_JWT_REFRESH_TTL:P30D}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:8088}
  media:
    storage-directory: ${APP_MEDIA_STORAGE_DIRECTORY:./data/media}
    max-file-size: ${APP_MEDIA_MAX_FILE_SIZE:8388608}
    max-pixels: ${APP_MEDIA_MAX_PIXELS:25000000}

logging:
  pattern:
    level: "%5p [traceId=%X{traceId:-}]"
  level:
    org.springframework.security: INFO
