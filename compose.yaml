name: ${COMPOSE_PROJECT_NAME:-jogajunto}

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - private

  backend:
    build:
      context: ./Backend
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    environment: &backend-environment
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      APP_JWT_SECRET: ${JWT_SECRET}
      APP_JWT_ISSUER: ${JWT_ISSUER}
      APP_JWT_ACCESS_TTL: ${JWT_ACCESS_TTL}
      APP_JWT_REFRESH_TTL: ${JWT_REFRESH_TTL}
      APP_CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      APP_MEDIA_STORAGE_DIRECTORY: /data/partiu-quadra
    volumes:
      - media_data:/data/partiu-quadra
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 15
      start_period: 20s
    networks:
      - private
      - public

  frontend:
    build:
      context: ./Frontend
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /var/cache/nginx:size=32m,mode=0755
      - /var/run:size=1m,mode=0755
    volumes:
      - ./Frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./Frontend/index.html:/usr/share/nginx/html/index.html:ro
      - ./Frontend/assets:/usr/share/nginx/html/assets:ro
      - ./Frontend/pages:/usr/share/nginx/html/pages:ro
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8088}:8080"
    networks:
      - public

volumes:
  postgres_data:
  media_data:

networks:
  public:
  private:
    internal: true
