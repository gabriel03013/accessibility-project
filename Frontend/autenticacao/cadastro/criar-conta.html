<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar conta | JogaJunto</title>
</head>

<body>
    <header><a href="../../index.html"><img src="../../logo.png" alt="Logo do JogaJunto"> JogaJunto</a><a
            href="../../index.html">Voltar para o início</a></header>
    <main>
        <section>
            <h1>Entre na comunidade.</h1>
            <p>Uma conta gratuita para reservar quadras, entrar em partidas e acompanhar seu histórico.</p><img
                src="../../quadra.png" alt="Pessoas praticando esporte coletivo em uma quadra">
            <ol>
                <li>Reserve em poucos passos</li>
                <li>Encontre gente do seu nível</li>
                <li>Avalie quadras e partidas</li>
            </ol>
        </section>
        <section>
            <p>CRIE SUA CONTA</p>
            <h2>Pronto para jogar?</h2>
            <p>Já tem uma conta? <a href="../entrar/entrar-na-conta.html">Entrar</a></p>
            <form action="../../conta/painel-da-conta.html"><label>Nome completo <input autocomplete="name"
                        required></label><label>E-mail <input type="email" autocomplete="email"
                        required></label><label>Telefone <input type="tel" autocomplete="tel"
                        required></label><label>Senha <input type="password" autocomplete="new-password"
                        required></label><label>Confirme a senha <input type="password" autocomplete="new-password"
                        required></label><label><input type="checkbox" required> Li e aceito os termos de
                    uso</label><button type="submit">Criar conta</button></form>
        </section>
    </main>
</body>

</html>
