<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Recusar solicitação — Partiu Quadra</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css">
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="../../assets/css/main.css?v=20260727-9">
  </head>
  <body data-page="rejectRequest">
    <a class="skip-link" href="#content">Pular para o conteúdo</a>
    <header class="app-header">
      <div class="nav-shell">
        <a class="brand-mark" href="../painel-proprietario/"
          ><span class="brand-symbol"
            ><i
              class="fa-solid fa-location-crosshairs"
              aria-hidden="true"
            ></i></span
          ><span>partiu quadra · proprietário</span></a
        ><a class="btn btn-quiet" href="../solicitacao/"
          ><i class="fa-solid fa-xmark" aria-hidden="true"></i> Cancelar</a
        >
      </div>
    </header>
    <main id="content" class="page-narrow">
      <section class="card p-7 max-w-xl mx-auto">
        <p class="eyebrow">Pedido selecionado</p>
        <h1 class="title-lg mt-2">Por que não será possível?</h1>
        <p class="lead mt-3">
          O motivo ajuda o jogador a entender e encontrar outra opção.
        </p>
        <form class="mt-7 space-y-5" action="../solicitacoes/" method="get">
          <fieldset>
            <legend class="label mb-3">Motivo</legend>
            <div class="grid gap-3">
              <label class="choice"
                ><input type="radio" name="reason" required><span
                  class="text-sm"
                  >Horário indisponível</span
                ></label
              ><label class="choice"
                ><input type="radio" name="reason"><span class="text-sm"
                  >Manutenção na quadra</span
                ></label
              ><label class="choice"
                ><input type="radio" name="reason"><span class="text-sm"
                  >Evento privado</span
                ></label
              ><label class="choice"
                ><input type="radio" name="reason"><span class="text-sm"
                  >Outro motivo</span
                ></label
              >
            </div>
          </fieldset>
          <div class="field-group">
            <label class="label" for="details">Explique brevemente</label
            ><textarea
              class="field"
              id="details"
              placeholder="Ex.: teremos manutenção no gramado neste fim de semana."
              required
            ></textarea>
          </div>
          <div class="flex gap-3">
            <button class="btn btn-danger flex-1" type="submit">
              Confirmar recusa</button
            ><a class="btn btn-secondary flex-1" href="../sugerir-horario/"
              >Sugerir outro horário</a
            >
          </div>
        </form>
      </section>
    </main>
    <script type="module" src="../../assets/js/app.js?v=20260727-9"></script>
  </body>
</html>
