<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sugerir outro horário — Partiu Quadra</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css">
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="../../assets/css/main.css?v=20260727-9">
  </head>
  <body data-page="counterRequest">
    <a class="skip-link" href="#content">Pular para o conteúdo</a>
    <header class="app-header">
      <div class="nav-shell">
        <a class="brand-mark" href="../painel-proprietario/"
          ><span class="brand-symbol"
            ><i
              class="fa-solid fa-location-crosshairs"
              aria-hidden="true"
            ></i></span
          ><span>partiu quadra · proprietário</span></a
        ><a class="btn btn-quiet" href="../solicitacao/"
          ><i class="fa-solid fa-xmark" aria-hidden="true"></i> Cancelar</a
        >
      </div>
    </header>
    <main id="content" class="page-narrow">
      <section class="card p-7 max-w-xl mx-auto">
        <p class="eyebrow">Contraproposta</p>
        <h1 class="title-lg mt-2">Ofereça outro horário.</h1>
        <p class="lead mt-3">Carregando os dados do pedido…</p>
        <form class="mt-7 space-y-5" action="../solicitacoes/" method="get">
          <div class="grid sm:grid-cols-2 gap-4">
            <div class="field-group">
              <label class="label" for="proposed-date">Nova data</label
              ><input class="field" id="proposed-date" type="date" required>
            </div>
            <div class="field-group">
              <label class="label" for="proposed-time">Novo horário</label
              ><select class="field" id="proposed-time" required>
                <option value="">Selecione</option>
                <option>20:00–21:00</option>
                <option>21:00–22:00</option>
              </select>
            </div>
          </div>
          <div class="field-group">
            <label class="label" for="message"
              >Mensagem <span class="muted font-normal">(opcional)</span></label
            ><textarea
              class="field"
              id="message"
              placeholder="Ex.: o horário das 19h já foi reservado, mas consigo receber vocês às 20h."
            ></textarea>
          </div>
          <button class="btn btn-primary btn-block" type="submit">
            Enviar nova sugestão
          </button>
          <p class="help text-center">
            O jogador poderá aceitar ou recusar a nova data.
          </p>
        </form>
      </section>
    </main>
    <script type="module" src="../../assets/js/app.js?v=20260727-9"></script>
  </body>
</html>
