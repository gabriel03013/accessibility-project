<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Criar time — Partiu Quadra</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css">
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="../../assets/css/main.css?v=20260727-9">
  </head>
  <body data-page="createTeam">
    <a class="skip-link" href="#content">Pular para o conteúdo</a>
    <header class="app-header">
      <div class="nav-shell">
        <a class="brand-mark" href="../inicio/"
          ><span class="brand-symbol"
            ><i
              class="fa-solid fa-location-crosshairs"
              aria-hidden="true"
            ></i></span
          ><span>partiu quadra</span></a
        ><a class="btn btn-quiet" href="../times/"
          ><i class="fa-solid fa-xmark" aria-hidden="true"></i> Cancelar</a
        >
      </div>
    </header>
    <main id="content" class="page-narrow">
      <p class="eyebrow">Novo time</p>
      <h1 class="title-lg mt-2">Dê um nome à turma.</h1>
      <p class="lead mt-3">
        Depois você convida os membros pelos nomes de usuário.
      </p>
      <form class="mt-8 space-y-6" action="../convidar-membros/" method="get">
        <section class="panel grid gap-5" aria-labelledby="identity">
          <h2 id="identity" class="title-md">Identidade</h2>
          <div class="flex gap-5 items-center">
            <div class="brand-symbol brand-symbol-lg">
              <i class="fa-solid fa-shield" aria-hidden="true"></i>
            </div>
            <p class="muted text-sm">
              O escudo usa as iniciais do time para ser fácil de reconhecer.
            </p>
          </div>
          <div class="field-group">
            <label class="label" for="team-name">Nome do time</label
            ><input
              type="text"
              class="field"
              id="team-name"
              maxlength="40"
              placeholder="Nome do time"
              required><small class="help">Até 40 caracteres.</small>
          </div>
          <div class="field-group">
            <label class="label" for="team-description"
              >Descrição
              <span class="muted font-normal">(opcional)</span></label
            ><textarea
              class="field"
              id="team-description"
              placeholder="Quando e onde vocês costumam jogar?"
            ></textarea>
          </div>
        </section>
        <fieldset class="panel">
          <legend class="title-md px-1">Esportes do time</legend>
          <p class="help mt-2">Selecione um ou mais.</p>
          <div class="grid sm:grid-cols-2 gap-3 mt-5">
            <label class="choice"
              ><input type="checkbox" checked><span
                ><strong class="text-sm">Futebol</strong></span
              ></label
            ><label class="choice"
              ><input type="checkbox" checked><span
                ><strong class="text-sm">Futsal</strong></span
              ></label
            ><label class="choice"
              ><input type="checkbox"><span
                ><strong class="text-sm">Futebol de areia</strong></span
              ></label
            ><label class="choice"
              ><input type="checkbox"><span
                ><strong class="text-sm">Futevôlei</strong></span
              ></label
            ><label class="choice"
              ><input type="checkbox"><span
                ><strong class="text-sm">Vôlei de quadra</strong></span
              ></label
            ><label class="choice"
              ><input type="checkbox"><span
                ><strong class="text-sm">Vôlei de praia/areia</strong></span
              ></label
            ><label class="choice"
              ><input type="checkbox"><span
                ><strong class="text-sm">Tênis</strong></span
              ></label
            ><label class="choice"
              ><input type="checkbox"><span
                ><strong class="text-sm">Basquete</strong></span
              ></label
            >
          </div>
        </fieldset>
        <button class="btn btn-primary btn-block" type="submit">
          Criar e convidar pessoas
          <i class="fa-solid fa-arrow-right" aria-hidden="true"></i>
        </button>
      </form>
    </main>
    <script type="module" src="../../assets/js/app.js?v=20260727-9"></script>
  </body>
</html>
