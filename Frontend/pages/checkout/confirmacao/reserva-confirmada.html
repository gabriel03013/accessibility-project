<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Reserva confirmada no Partiu Quadra." />
    <title>Reserva confirmada | Partiu Quadra</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css"
    />
    <link rel="stylesheet" href="/assets/css/main.css" />
    <script src="/assets/js/theme-init.js"></script>
  </head>
  <body data-shell="minimal">
    <a class="skip-link" href="#conteudo">Pular para o conteúdo</a>
    <header class="site-header" data-site-header></header>
    <main id="conteudo" class="checkout-page">
      <ol class="steps" aria-label="Etapas da reserva">
        <li class="is-complete">Carrinho</li>
        <li class="is-complete">Identificação</li>
        <li class="is-complete">Pagamento</li>
        <li aria-current="step">Confirmação</li>
      </ol>
      <section class="success-hero">
        <span class="success-icon" aria-hidden="true">✓</span>
        <p class="eyebrow">Tudo certo</p>
        <h1>Reserva confirmada!</h1>
        <p class="lead">
          Arena Vila Mariana · quinta-feira, às 19:30. Enviamos o resumo para o
          seu e-mail.
        </p>
        <div class="panel text-left mt-8">
          <div class="summary-row">
            <span>Código</span><strong>JJ-2408-1930</strong>
          </div>
          <div class="summary-row">
            <span>Duração</span><strong>1 hora</strong>
          </div>
          <div class="summary-row summary-total">
            <span>Total</span><span>R$ 96</span>
          </div>
        </div>
        <div class="hero-actions justify-center mt-8">
          <a
            class="btn btn-primary"
            href="../../conta/reservas/minhas-reservas.html"
            >Ver minhas reservas</a
          ><a class="btn btn-secondary" href="../../inicio/pagina-inicial.html"
            >Voltar ao início</a
          >
        </div>
      </section>
    </main>
    <script type="module" src="/assets/js/app.js"></script>
  </body>
</html>
