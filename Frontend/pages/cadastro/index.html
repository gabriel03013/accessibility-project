<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Criar conta — Partiu Quadra</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css">
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="../../assets/css/main.css?v=20260727-9">
  </head>
  <body data-page="register">
    <a class="skip-link" href="#content">Pular para o conteúdo</a>
    <header class="app-header">
      <div class="nav-shell">
        <a class="brand-mark" href="../inicio/"
          ><span class="brand-symbol"
            ><i
              class="fa-solid fa-location-crosshairs"
              aria-hidden="true"
            ></i></span
          ><span>partiu quadra</span></a
        ><a class="btn btn-quiet" href="../login/">Já tenho conta</a>
      </div>
    </header>
    <main id="content" class="page-narrow">
      <div class="max-w-xl mx-auto">
        <p class="eyebrow">Sua conta</p>
        <h1 class="title-lg mt-2">Comece pelo seu nome de usuário.</h1>
        <p class="lead mt-3">
          Ele é único e será usado pelos seus amigos para convidar você para
          times.
        </p>
        <form class="card p-7 mt-7 space-y-5" data-register-form>
          <div class="grid sm:grid-cols-2 gap-4">
            <div class="field-group">
              <label class="label" for="name">Nome completo</label
              ><input
                type="text"
                class="field"
                id="name"
                name="displayName"
                autocomplete="name"
                required>
            </div>
            <div class="field-group">
              <label class="label" for="username">Nome de usuário</label>
              <div class="relative">
                <span class="absolute left-3 top-3 muted" aria-hidden="true"
                  >@</span
                ><input
                  type="text"
                  class="field pl-8"
                  id="username"
                  name="username"
                  pattern="[a-zA-Z0-9._-]{3,32}"
                  aria-describedby="username-help"
                  placeholder="seunome"
                  required>
              </div>
              <small id="username-help" class="help"
                >Letras, números, ponto, hífen ou sublinhado.</small
              >
            </div>
          </div>
          <div class="field-group">
            <label class="label" for="email">E-mail</label
            ><input
              class="field"
              id="email"
              name="email"
              type="email"
              autocomplete="email"
              required>
          </div>
          <div class="field-group">
            <label class="label" for="password">Crie uma senha</label
            ><input
              class="field"
              id="password"
              name="password"
              type="password"
              autocomplete="new-password"
              minlength="12"
              maxlength="72"
              aria-describedby="password-help"
              required><small id="password-help" class="help"
              >Pelo menos 12 caracteres.</small
            >
          </div>
          <fieldset class="field-group">
            <legend class="label">Como você quer usar o Partiu Quadra?</legend>
            <div class="grid sm:grid-cols-2 gap-3">
              <label class="choice">
                <input type="radio" name="accountType" value="PLAYER" checked>
                <span><strong class="text-sm">Quero jogar</strong><small class="help block mt-1">Reservar quadras e organizar times.</small></span>
              </label>
              <label class="choice">
                <input type="radio" name="accountType" value="OWNER">
                <span><strong class="text-sm">Tenho uma quadra</strong><small class="help block mt-1">Anunciar espaços e receber pedidos.</small></span>
              </label>
            </div>
          </fieldset>
          <label class="choice"
            ><input type="checkbox" required><span class="text-sm"
              >Concordo com os termos de uso e a política de privacidade.</span
            ></label
          ><button class="btn btn-primary btn-block" type="submit">
            Criar conta
          </button>
        </form>
      </div>
    </main>
    <script type="module" src="../../assets/js/app.js?v=20260727-9"></script>
  </body>
</html>
