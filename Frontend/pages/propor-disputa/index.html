<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Propor quadra e horário — Partiu Quadra</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css">
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="../../assets/css/main.css?v=20260727-9">
  </head>
  <body data-page="challengeProposal">
    <a class="skip-link" href="#content">Pular para o conteúdo</a>
    <header class="app-header">
      <div class="nav-shell">
        <a class="brand-mark" href="../inicio/"
          ><span class="brand-symbol"
            ><i
              class="fa-solid fa-location-crosshairs"
              aria-hidden="true"
            ></i></span
          ><span>partiu quadra</span></a
        ><a class="btn btn-quiet" href="../chat-desafio/"
          ><i class="fa-solid fa-xmark" aria-hidden="true"></i> Cancelar</a
        >
      </div>
    </header>
    <main id="content" class="page-narrow">
      <div class="max-w-2xl mx-auto">
        <p class="eyebrow">Proposta de disputa</p>
        <h1 class="title-lg mt-2">Escolha a quadra e o horário.</h1>
        <p class="lead mt-3">
          A outra administração poderá aceitar, sugerir uma alteração ou
          recusar.
        </p>
        <form
          class="mt-8 space-y-6"
          action="../responder-desafio/"
          method="get"
        >
          <fieldset class="panel">
            <legend class="title-md px-1">Quadra</legend>
            <div class="grid gap-3 mt-5">
              <p class="help" role="status">Carregando quadras salvas…</p>
            </div>
            <a class="link text-sm inline-block mt-4" href="../buscar/"
              >Explorar outras quadras</a
            >
          </fieldset>
          <section class="panel">
            <h2 class="title-md">Data e horário</h2>
            <div class="grid sm:grid-cols-2 gap-4 mt-5">
              <div class="field-group">
                <label class="label" for="challenge-date">Data</label
                ><input class="field" id="challenge-date" type="date" required>
              </div>
              <div class="field-group">
                <label class="label" for="challenge-time">Horário</label
                ><select class="field" id="challenge-time" required>
                  <option>10:00–11:00</option>
                  <option>11:00–12:00</option>
                </select>
              </div>
            </div>
          </section>
          <div class="panel field-group">
            <label class="label" for="observation"
              >Observação
              <span class="muted font-normal">(opcional)</span></label
            ><textarea
              class="field"
              id="observation"
              placeholder="Ex.: cada time leva uma bola; fazemos dois tempos de 20 minutos."
            ></textarea>
          </div>
          <button class="btn btn-primary btn-block" type="submit">
            Enviar proposta no chat
          </button>
        </form>
      </div>
    </main>
    <script type="module" src="../../assets/js/app.js?v=20260727-9"></script>
  </body>
</html>
